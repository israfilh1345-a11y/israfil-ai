<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Israfil JARVIS বাংলা Voice Test</title><style>body{font-family:system-ui;background:#081525;color:#e8f5ff;margin:0;padding:24px}.wrap{max-width:600px;margin:auto}h1{font-size:24px}button,input,textarea{box-sizing:border-box;width:100%;margin:8px 0;padding:14px;border-radius:12px;border:1px solid #42627e;font-size:16px}button{background:#13b8b0;color:#061522;font-weight:700}button:disabled{opacity:.5}input,textarea{background:#10263a;color:white}textarea{min-height:145px}#status{color:#a9c7db}small{color:#a9c7db}</style></head><body><div class="wrap"><h1>🎙️ Israfil JARVIS বাংলা Voice Test</h1><p>বাংলায় কথা বলুন, তারপর Stop চাপুন।</p><label for="password">Voice Password (শুধু এই পেজে ব্যবহার হবে)</label><input id="password" type="password" autocomplete="off" placeholder="VOICE_PASSWORD লিখুন"><button id="start">🎙️ Start Recording</button><button id="stop" disabled>⏹ Stop & Transcribe</button><p id="status" role="status">Ready</p><label for="result">বাংলা লেখা</label><textarea id="result" placeholder="এখানে আপনার কথা লেখা হবে"></textarea><button id="copy">Copy Text</button><p><small>আপনার পাসওয়ার্ড এখানে সংরক্ষণ করা হয় না। অডিও শুধু আপনার Cloudflare Voice Worker-এ পাঠানো হবে।</small></p></div><script>
const VOICE_URL='https://israfil-voice-ai.israfilh1345.workers.dev/api/transcribe';
const start=document.querySelector('#start'),stop=document.querySelector('#stop'),status=document.querySelector('#status'),result=document.querySelector('#result'),password=document.querySelector('#password');let recorder,stream,chunks=[];
start.onclick=async()=>{if(!window.MediaRecorder){status.textContent='এই Browser-এ MediaRecorder নেই';return;}if(!password.value){status.textContent='আগে VOICE_PASSWORD লিখুন';return;}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());start.disabled=false;stop.disabled=true;const blob=new Blob(chunks,{type:recorder.mimeType||'audio/mp4'});if(blob.size>2*1024*1024){status.textContent='অডিও 2MB-এর বেশি। ছোট রেকর্ডিং করুন।';return;}status.textContent='বাংলা লেখা তৈরি হচ্ছে…';try{const res=await fetch(VOICE_URL,{method:'POST',headers:{'Content-Type':blob.type,'X-App-Password':password.value},body:blob});const data=await res.json();if(!res.ok)throw new Error(data.error||('HTTP '+res.status));result.value=data.text||'';status.textContent=result.value?'বাংলা লেখা প্রস্তুত':'কোনো কথা শনাক্ত হয়নি';}catch(e){status.textContent='সমস্যা: '+e.message;}};recorder.start();start.disabled=true;stop.disabled=false;status.textContent='রেকর্ড হচ্ছে… ৫–১০ সেকেন্ড বাংলায় বলুন';}catch(e){stream?.getTracks().forEach(t=>t.stop());status.textContent='Microphone সমস্যা: '+e.message;}};
stop.onclick=()=>{if(recorder?.state==='recording'){stop.disabled=true;recorder.stop();}};
document.querySelector('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(result.value);status.textContent='লেখা Copy হয়েছে';}catch{result.select();status.textContent='লেখা Select হয়েছে—Copy করুন';}};
</script></body></html>
